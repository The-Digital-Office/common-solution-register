# Site configuration (specification 6.3). A new host changes these values and
# the repository settings listed in section 8 of the specification.

title = "Common Solution Register: Demonstrator"
# A preview: every page asks search engines not to index it (a robots meta tag;
# a robots.txt would be ignored, because this is a project site). Published as
# a preview on 9 November 2026, before the courtesy notes and sign-off; set to
# false when the site goes to beta (docs/publication-checklist.md).
preview = true
base_url = "https://the-digital-office.github.io/common-solution-register/"
# Where the harvester reads last-valid copies and hashes; empty means
# <base_url>api/v0/harvest-state.json.
state_url = ""
repository_url = "https://github.com/The-Digital-Office/common-solution-register"
default_branch = "main"
host_organisation = "The Digital Office for Scottish Local Government"
# The host's logo in the footer, as a path in the built site; its alt text says
# "Hosted for demonstration by" the host. Empty shows that sentence as text.
host_logo = "static/host/digital-office-logo.svg"
# Where the logo links to; empty for no link.
host_url = "https://digitaloffice.scot/"
# Input I3: the role mailbox for the site and emailed drafts (requested 3 November 2026).
contact_mailbox = "solution-register@digitaloffice.scot"
# Input I4: the feedback route. GitHub issues; people without a GitHub account
# use the mailbox above (decided 3 November 2026).
feedback_url = "https://github.com/The-Digital-Office/common-solution-register/issues"

[currency]
due_after_months = 11
stale_after_months = 12
# Fictional example records (csr-9000 to csr-9999) are judged as on this
# date, so they keep showing the current, due and stale states they were
# written to show. Real records are always judged as on the build date.
# Empty means the build date.
examples_as_of = "2026-11-02"

[harvest]
max_bytes = 262144
timeout_seconds = 10

[publication]
# Inputs the author completes before publication (specification 10.2). Until
# each is filled in, the page shows "To be completed before publication" and
# csr build lists it.
data_controller_address = ""
dpo_contact = ""
lawful_basis = ""          # input I8: as agreed with the Data Protection Officer
retention = ""
feedback_form = ""         # input I4: owner and retention of the feedback form
accessibility_assessment = ""
accessibility_reply_days = "10"
accessibility_tested_on = ""
statements_prepared_on = ""
