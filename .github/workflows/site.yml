name: Site

# Tests, validates, harvests, builds and (once enabled) deploys the register
# (specification 6.10).
#
# Pull requests: run the tests, validate the records against the base branch,
# harvest the sources in this repository, fetch and check any pointer the pull
# request adds or changes (it must pass), build, and upload a preview.
#
# Pushes to main, the daily schedule and on-demand runs: harvest every
# registered source, starting from the state published on the live site,
# validate, build, and write the harvest report to the job summary. The site
# is deployed to GitHub Pages only when the repository variable PAGES_ENABLED
# is "true"; until then the deploy job is skipped.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-baselines:
        description: "Remake the UI test baselines in CI and upload them as the ui-baselines artifact"
        type: boolean
        default: false
  schedule:
    - cron: "23 5 * * *" # daily at 05:23 UTC

permissions:
  contents: read

concurrency:
  # One run per pull request at a time, newer pushes cancelling older runs.
  # Runs on main queue instead, so a deployment is never cut off part-way.
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history, so csr validate --base can find the merge base.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Install the official publiccode.yml parser (pinned, checksum verified)
        run: python tools/install-publiccode-parser.py

      - name: Run tests
        run: pytest -q

      - name: Validate records
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            csr validate --format github --base "origin/$BASE_REF"
          else
            csr validate --format github
          fi

      - name: Harvest (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          csr harvest --no-network --format github
          # Pointers added or changed by this pull request are fetched now, and must pass
          # (specification 6.12): the owner's file is checked before it is registered.
          changed=$(git diff --name-only --diff-filter=AMR "origin/$BASE_REF"...HEAD -- 'records/*.yaml' \
            | xargs -r -n1 basename | sed 's/\.yaml$//' | tr '\n' ' ')
          if [[ -n "$changed" ]]; then
            # shellcheck disable=SC2086 # one argument per record id
            csr harvest --state .harvest/harvest-state.json --only $changed --fail-on-problems \
              --format github --summary "$GITHUB_STEP_SUMMARY"
          fi

      - name: Harvest (every registered source)
        if: github.event_name != 'pull_request'
        # Starts from the state published on the live site (state_url in site.toml);
        # before the first deployment there is none, and the harvest starts fresh.
        run: csr harvest --format github --summary "$GITHUB_STEP_SUMMARY"

      - name: Build site
        run: csr build --harvest .harvest/harvest-state.json

      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: site/
          retention-days: 14

      - name: Upload site for GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  ui:
    name: UI tests
    # Required check (specification 6.13): visual comparison with ui/baseline/, the
    # behaviour of each parity-table row, and axe-core, against the fixture register.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          python -m pip install -e .
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run UI tests
        if: ${{ !inputs.update-baselines }}
        run: npm run test:ui

      - name: Remake the baselines
        # After a deliberate design change: download the ui-baselines artifact, review the
        # images, and commit them to ui/baseline/ in the pull request that made the change.
        if: ${{ inputs.update-baselines }}
        run: npx playwright test --config ui/playwright.config.js visual --update-snapshots=all

      - name: Upload the remade baselines
        if: ${{ inputs.update-baselines }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-baselines
          path: ui/baseline/
          retention-days: 14

      - name: Upload the report and differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy
    needs: [validate, ui]
    # Skipped until an owner of the repository sets the variable PAGES_ENABLED to "true",
    # after the publication sign-off (specification 9).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  reusable:
    name: Reusable workflow
    # Runs this repository's own solution.yml and publiccode.yml through the workflow
    # owners call from their repositories, at this commit.
    uses: ./.github/workflows/validate-solution.yml
    with:
      register-ref: ${{ github.sha }}
