name: Site

# Validates the register and its tooling. Later slices add the UI tests and
# deploy jobs (spec 6.10).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The full history, so csr validate --base can find the merge base.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Validate records
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ -n "$BASE_REF" ]]; then
            csr validate --format github --base "origin/$BASE_REF"
          else
            csr validate --format github
          fi

      - name: Build site
        run: csr build

      - name: Upload preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: site/
          retention-days: 14
