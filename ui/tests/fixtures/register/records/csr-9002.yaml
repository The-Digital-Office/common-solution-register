capabilities:
  - case-management
  - integration-and-apis
status: live
intended_adopters:
  - local-government
  - nhs-scotland
  - non-departmental-public-bodies
terms_of_use:
  type: service-terms
  url: https://example.gov.uk/benefits-api/terms
