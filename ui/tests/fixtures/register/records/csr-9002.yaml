  summary: Apply for API access, complete the data sharing agreement, then test in the sandbox.
charging:
  applies: false
interfaces:
  - type: rest
    documentation_url: https://developer.example.gov.uk/benefits-api/
    description: Create, read and update cases.
  - type: event
    documentation_url: https://developer.example.gov.uk/benefits-api/events/
    description: Case status changes, sent to a partner's webhook.
