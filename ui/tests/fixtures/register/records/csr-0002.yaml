schema_version: "0.1"
id: csr-0002
record_status: owner-confirmed
name: Digital Office repository baseline
summary: >-
  Organisation defaults, a repository template and a shared standards workflow
  for running public repositories with a light, consistent baseline.
purpose: >-
  Gives a GitHub organisation a proportionate baseline for its repositories.
  Organisation-wide community health files, issue forms and a pull request
  template apply to every repository. A shared workflow checks required files
  and validates publiccode.yml. A repository template supplies the files each
  repository needs, with a setup workflow that fills them in. A script applies
  branch rules, merge settings, security settings and labels. Most of the
  baseline is supplied or enforced automatically, to keep the burden on
  maintainers low.
