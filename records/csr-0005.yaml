schema_version: "0.1"
id: csr-0005
record_status: demonstration
name: One Scotland Gazetteer
summary: >-
  Scotland's address database, made up of the gazetteers maintained by all 32
  local authorities, with web services for authorised organisations.
purpose: >-
  An address database made up of all 32 individual local authority
  gazetteers. All addresses are created in accordance with the national
  standard for addressing, BS7666:2006, and the Scottish Gazetteer
  Conventions, with spatially referenced address records and property
  lifecycle details. A companion dataset, the National Street Gazetteer for
  Scotland, depicts every street, road, track or cycleway in Scotland with
  Unique Street Reference Numbers (USRN). REST and SOAP services provide the
  data as an API for authorised organisations to use in their address and
  street-based applications. The data is maintained daily.
