adoption_route:
  summary: >-
    Members of the Public Sector Geospatial Agreement (PSGA) receive the data,
    and can use the REST and SOAP services, for public sector use. Commercial
    users obtain it through Ordnance Survey's AddressBase products. The public
    portal provides a limited address and map search after its terms are
    accepted.
