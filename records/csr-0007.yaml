schema_version: "0.1"
id: csr-0007
record_status: demonstration
name: GOV.UK Notify
summary: >-
  Lets public sector service teams send emails, text messages and letters,
  from the website or automatically through its API.
purpose: >-
  Makes it easy for public sector service teams to send emails, text messages
  and letters. Teams without technical knowledge can create templates, add
  personalisation, send messages in bulk by uploading a spreadsheet, and see
  when messages have been delivered. To send messages automatically, a
  developer integrates the GOV.UK Notify API with a web application or back
  office system, using a client library or the REST API directly. Notify
  prints and posts letters.
