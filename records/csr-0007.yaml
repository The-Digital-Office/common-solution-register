  summary: >-
    You accept the terms of use when you create an account. Only public sector
    organisations can accept the data processing and financial agreement.
adoption_route:
  summary: >-
    Create an account for free and add a service, which starts in trial mode.
    Suppliers working for a public sector organisation are invited to join by
    someone from that organisation. To send messages automatically, integrate
    with the API.
  url: https://www.notifications.service.gov.uk/features/who-can-use-notify
charging:
  applies: true
  model: per-transaction
  summary: >-
    Emails are free. Up to 20,000 free text messages a year, then 2.4 pence per
    message. Letters from 63.8 pence to print and post a one page letter. No
    monthly charge, setup fee or procurement cost.
  url: https://www.notifications.service.gov.uk/pricing
support:
  summary: >-
    Support 24 hours a day, 7 days a week for emergencies, with a reply within
    30 minutes; otherwise a reply by the end of the next working day.
  url: https://www.notifications.service.gov.uk/support
