name: mygovscot myaccount
summary: >-
  The simple and secure sign-in service for online public services in
  Scotland: one account that people can use across multiple organisations.
purpose: >-
  Lets people living in Scotland set up one online account and use it across
  multiple organisations, for services such as paying council tax, requesting
  a parking permit, paying for school meals, or applying for benefits or a
  National Entitlement Card. For public service providers it offers
  standards-based authentication and identity verification, built around four
  services: authentication (with stronger options a provider can request),
  channel shift (registering people in person or by phone), identity
  verification (online, or face to face to the same standards) and data
  integrity (notifying providers of changes in their users' circumstances).
  Depending on a service's needs it can meet Good Practice Guide 44
  authentication levels and Good Practice Guide 45 identity profiles: an
  unverified account may suit reporting a missed bin, while NHS Lothian and My
  Diabetes My Way require a verified one. It is
  offered as a toolkit that can be deployed in different configurations.
  getyournec.scot, used by all 32 councils for National Entitlement Card
  applications, and parentsportal.scot, used by 23, rely on it. People must be
  12 or over to register.
