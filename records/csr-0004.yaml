name: Scottish Government Design System
summary: >-
  Code, components and guidance for building websites and web applications for
  the Scottish Government and other Scottish public sector bodies.
purpose: >-
  Contains the code needed to start building user interfaces for websites and
  web applications for the Scottish Government and other Scottish public sector
  bodies. Its website shows live examples of the available components,
  alongside guidance on how and when to use them. Teams install it as a
  package from npm and include its compiled CSS and JavaScript in their
  projects.
