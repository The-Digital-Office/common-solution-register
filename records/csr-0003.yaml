id: csr-0003
record_status: demonstration
name: ScotAccount
summary: >-
  A secure and simple way for people to prove who they are and that they are
  eligible when they use public services online.
purpose: >-
  Lets people sign in to public services online using two-factor
  authentication, verify their identity if a service requires it (by photo ID
  or, for people without photographic ID, by security questions), and save
  their digital identity to reuse with other public services. Two-factor
  sign-in is available to public services as a stand-alone feature. Services
  using it include Disclosure Scotland's online disclosure journey and the
  Crown Office and Procurator Fiscal Service's Witness Gateway.
