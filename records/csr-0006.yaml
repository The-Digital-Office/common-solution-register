  type: service-terms
  url: https://data.spatialhub.scot/terms_and_condition
  summary: >-
    National open datasets are shared under the Open Government Licence.
    Premium datasets are available to public sector organisations through the
    Public Sector Geospatial Agreement (PSGA), to academic institutions in
    Scotland through EDINA's DigiMap, and to others through commercial
    partners.
adoption_route:
  summary: >-
    Register for a free Spatial Hub account, then download data or connect to
    web services. To use premium datasets, ask the Spatial Hub team to register
    your account against your PSGA organisation. Local authorities and partners
    that provide data join an Organisation on the Spatial Hub.
  url: https://data.spatialhub.scot/faq
charging:
