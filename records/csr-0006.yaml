id: csr-0006
record_status: demonstration
name: Spatial Hub
summary: >-
  A platform for hosting and publishing Scottish spatial data, which combines
  local authority datasets into Scotland-wide national datasets.
purpose: >-
  Collects datasets from local authorities and other partner organisations to
  form Scotland-wide national datasets, and publishes these in various formats
  to maximise their use. Collected updates are quality assessed, cleaned,
  standardised and amalgamated every three months (some datasets, such as
  planning applications and building standards, daily), then published as web
  services and file downloads. Anyone can search datasets and preview them on a
  map; downloading or connecting to data needs a free account. Some local
  authorities use it as their open data portal.
